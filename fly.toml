# fly.toml app configuration file generated for oriva-core on 2026-09-01T16:05:35-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'oriva-core'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile.compliance'

[env]
  EBAY_DELETION_INBOX_PATH = '/data/ebay-deletion/inbox.sqlite3'
  EBAY_DATA_ROOTS = '/data/ebay-data'
  EBAY_DELETION_WORKER_INTERVAL_SECONDS = '5'

[processes]
  app = '/app/compliance/start.sh'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    method = 'GET'
    path = '/healthz'
    timeout = '3s'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[[mounts]]
  source = 'oriva_data'
  destination = '/data'
  processes = ['app']
